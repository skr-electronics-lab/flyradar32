<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 48" width="248" height="48" fill="none" role="img" aria-label="Support on Ko-fi">
  <defs>
    <style>
      .btn-bg {
        fill: #0f172a;
        stroke: #334155;
        stroke-width: 1.5;
        rx: 10px;
        transition: stroke 0.3s;
      }
      .badge-bg {
        fill: #FF5E5B;
        rx: 8px;
      }
      .btn-text-main {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 0.2px;
      }
      .btn-text-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
      .cup-body {
        fill: #ffffff;
      }
      .cup-heart {
        fill: #FF5E5B;
      }
      .steam-line {
        stroke: #ffffff;
        stroke-width: 1.5;
        stroke-linecap: round;
        fill: none;
      }
    </style>
  </defs>

  <!-- Button Container Base -->
  <rect class="btn-bg" x="1" y="1" width="246" height="46">
    <animate attributeName="stroke" values="#334155;#ff5a00;#334155" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Icon Badge Left -->
  <g transform="translate(10, 8)">
    <rect class="badge-bg" width="32" height="32" rx="8" />

    <!-- Coffee Cup Graphic -->
    <g transform="translate(6, 11)">
      <!-- Animated Steam Wisps -->
      <path class="steam-line" d="M 4 -3 Q 6 -6 4 -9">
        <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4" dur="2.4s" repeatCount="indefinite" />
      </path>
      <path class="steam-line" d="M 10 -2 Q 8 -5 10 -8">
        <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
      </path>
      <path class="steam-line" d="M 15 -3 Q 17 -6 15 -9">
        <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="1.6s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4" dur="2.4s" begin="1.6s" repeatCount="indefinite" />
      </path>

      <!-- Cup Profile -->
      <path class="cup-body" d="M 0 0 L 15 0 C 15 0 16 7 14 10 C 12 13 4 13 2 10 C 0 7 0 0 0 0 Z" />
      <!-- Cup Handle -->
      <path d="M 14 2 C 17 2 18 4 18 6 C 18 8 16 9 14 9" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none" />
      <!-- Heart on Cup -->
      <path class="cup-heart" d="M 7.5 4.5 C 6.5 3 4.5 3.5 4.5 5 C 4.5 7 7.5 9 7.5 9 C 7.5 9 10.5 7 10.5 5 C 10.5 3.5 8.5 3 7.5 4.5 Z">
        <animate attributeName="transform" type="scale" values="1;1.15;1" dur="1.8s" repeatCount="indefinite" additive="sum" />
      </path>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(54, 21)">
    <text class="btn-text-main" x="0" y="0">Support on Ko-fi</text>
    <text class="btn-text-sub" x="0" y="15">skrelectronicslab</text>
  </g>

  <!-- Right Arrow Indicator -->
  <g transform="translate(222, 24)">
    <path d="M 0 -4 L 4 0 L 0 4" stroke="#94a3b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="transform" type="translate" values="0 0; 3 0; 0 0" dur="2s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
