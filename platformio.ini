[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ 8.3.11   ; pinned: dark-theme greys changed in 8.4 (screen bg went lighter)
    bblanchon/ArduinoJson @ ^6.21.3
    ESP32Async/ESPAsyncWebServer @ ^3.0.0
    ESP32Async/AsyncTCP @ ^3.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    ; NOTE: these describe the panel's native (rotation-0, PORTRAIT)
    ; resolution and must stay 128x160 — landscape mode is achieved by
    ; calling tft.setRotation(TFT_ROTATION) in code (see config.h), not
    ; by changing these two flags. Swapping them here was the original
    ; source of the "cut off" bug: it desynced the driver's init
    ; sequence from what the rest of the firmware assumed.
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DST7735_BLACKTAB=1
    -DCGRAM_OFFSET=1
    -DTFT_X_OFFSET=1
    -DTFT_Y_OFFSET=2
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=27000000
    -I include